name: Itemfield
description: 'Itemfield was an enterprise data-integration software company known for its Complex
  Data Exchange (CDE) and B2B data-transformation technology, which parsed, mapped, and transformed
  complex, unstructured, and industry-standard message formats into structured data. Itemfield was
  acquired by Informatica in 2006, and its technology was absorbed into Informatica''s B2B Data
  Transformation product line. The company was surfaced as a portfolio company of Accel and added to
  the API Evangelist network as a stub. Enrichment found no surviving independent Itemfield developer
  surface: the itemfield.com domain now resolves under Informatica-managed DNS and serves no HTTP
  content, so there is no live API, documentation, portal, or specification to harvest.'
